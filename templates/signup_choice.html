<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MindShield</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c084fc;
            --secondary: #f9a8d4;
            --text-dark: #5b326f;
            --text-light: #7b7285;
            --card: rgba(255,255,255,0.78);
            --shadow: rgba(192,132,252,0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #ffe7f4 0%, transparent 30%),
                radial-gradient(circle at bottom right, #efe2ff 0%, transparent 30%),
                linear-gradient(135deg, #fff8fc, #f7efff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 580px;
            background: var(--card);
            backdrop-filter: blur(14px);
            border-radius: 28px;
            padding: 34px 30px;
            box-shadow: 0 18px 40px var(--shadow);
            text-align: center;
        }

        h1 {
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        p {
            color: var(--text-light);
            margin-bottom: 26px;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .choice-card {
            display: block;
            text-decoration: none;
            color: var(--text-dark);
            background: rgba(255,255,255,0.8);
            padding: 26px 20px;
            border-radius: 22px;
            box-shadow: 0 10px 24px rgba(192,132,252,0.1);
            transition: 0.25s ease;
        }

        .choice-card:hover {
            transform: translateY(-4px);
            background: linear-gradient(135deg, #fff6fb, #f8f0ff);
        }

        .choice-card h2 {
            margin-bottom: 10px;
        }

        .choice-card span {
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.6;
        }

        .back {
            margin-top: 22px;
            display: inline-block;
            color: #d946ef;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .choice-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Create Your Account</h1>
    <p>Choose how you want to use MindShield.</p>

    <div class="choice-grid">
        <a href="/organization" class="choice-card">
            <h2>Organization</h2>
            <span>For students and counselors through a college or institution.</span>
        </a>

        <a href="/self-signup" class="choice-card">
            <h2>Self</h2>
            <span>For personal use without counselor chat.</span>
        </a>
    </div>

    <a href="/login" class="back">Back to Login</a>
</div>

</body>
</html>
